name: Secret scan

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Look for committed API keys / tokens
        run: |
          set -euo pipefail
          # 只扫会进版本库的文本文件；占位符（如 sk-test-xxx）不会命中，因为有长度下限
          pattern='(sk-[A-Za-z0-9_-]{24,}|github_pat_[A-Za-z0-9_]{30,}|ghp_[A-Za-z0-9]{30,})'
          if grep -rInE "$pattern" \
              --include='*.md' --include='*.yml' --include='*.yaml' \
              --include='*.py' --include='*.toml' --include='*.json' \
              --include='*.example' --include='*.env*' \
              --exclude-dir='.git' . ; then
            echo "::error title=疑似密钥被提交::上面的文件里出现了形似真实 key 的字符串。请立即吊销该 key，并从提交历史中移除。"
            exit 1
          fi
          echo "未发现疑似密钥"
