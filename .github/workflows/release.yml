name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 已存在的 tag（如 v0.2.0）
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        run: echo "name=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Extract notes from CHANGELOG
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > notes.md
          import os
          import re
          import sys

          tag = os.environ["TAG"]
          version = tag[1:] if tag.startswith("v") else tag
          text = open("CHANGELOG.md", encoding="utf-8").read()
          match = re.search(
              rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)",
              text,
              re.S | re.M,
          )
          if not match:
              sys.exit(f"CHANGELOG.md 缺少 {version} 的段落")
          print(match.group(1).strip())
          PY
          head -20 notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release 已存在，更新 notes"
            gh release edit "$TAG" --title "CodeRev $TAG" --notes-file notes.md
          else
            gh release create "$TAG" --title "CodeRev $TAG" --notes-file notes.md --verify-tag
          fi
