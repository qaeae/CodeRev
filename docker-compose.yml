name: coderev

services:
  app:
    build: .
    image: coderev:local
    command: ["serve", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "8080:8080"
    environment:
      # 模型（任何 OpenAI 兼容接口）
      CODEREV_PROVIDER: ${CODEREV_PROVIDER:-openai}
      CODEREV_MODEL: ${CODEREV_MODEL:-}
      CODEREV_BASE_URL: ${CODEREV_BASE_URL:-}
      CODEREV_API_KEY: ${CODEREV_API_KEY:-}
      # webhook 与回写评论
      CODEREV_WEBHOOK_SECRET: ${CODEREV_WEBHOOK_SECRET:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    volumes:
      # 白名单等服务器配置，只读挂载；改完自动生效（按 mtime 重载）
      - ./config:/app/config:ro
      # SQLite 持久化
      - coderev-data:/app/data
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - |
          import urllib.request
          urllib.request.urlopen("http://127.0.0.1:8080/healthz", timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  coderev-data:

